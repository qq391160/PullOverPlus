name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: 编译
        run: |
          exec > >(tee "$GITHUB_WORKSPACE/build.log") 2>&1
          set -x
          unzip -q src-latest.zip -d src
          git clone -q --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos" || echo "克隆 theos 失败"
          brew install -q dpkg ldid || echo "brew 失败（可忽略）"
          sudo ln -sfn "$HOME/theos" /opt/theos
          cd src/* && chmod +x build.sh
          ./build.sh roothide release || echo "build.sh 退出码=$?"
          find . -name '*.deb' -print
          cp -v packages/*.deb "$GITHUB_WORKSPACE"/ || true
          ls -la "$GITHUB_WORKSPACE"
      - name: 把结果放进仓库
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -f deb-latest.deb
          DEB=$(ls -1 com.huayuarc*.deb 2>/dev/null | head -1)
          echo "找到的 deb: [$DEB]"
          [ -n "$DEB" ] && cp "$DEB" deb-latest.deb
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          [ -f deb-latest.deb ] && git add -f deb-latest.deb || true
          [ -f build.log ] && git add -f build.log || true
          git commit -m "build $(date -u +%H%M)" || echo "无变化"
          git push origin HEAD:main || echo "推送失败"
